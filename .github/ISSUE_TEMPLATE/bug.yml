name: Bug
description: The engine, a command or the website does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps and output
      description: Command, full output and the output of `./machbench doctor`.
      render: text
