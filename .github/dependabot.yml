version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      # Major versions come as separate pull requests, so one incompatible release cannot block the rest.
      site:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Follows the Node.js version the workflows build with (node-version in ci.yml and pages.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
