version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      # Major versions come as separate pull requests, so one incompatible release cannot block the rest.
      site:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Follows the Node.js version the workflows build with (node-version in ci.yml and pages.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The site's type checker, @astrojs/check, accepts TypeScript 5 and 6 only (its peer dependency), so
      # `npm ci` fails with TypeScript 7. Remove this entry when a release of @astrojs/check accepts 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
