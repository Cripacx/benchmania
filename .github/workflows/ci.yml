name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Engine, manifests and results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest==9.2.0
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Validate manifests and result bundles
        run: ./benchmania validate
      - name: Build the website dataset
        run: ./benchmania publish --out /tmp/site-data
      - name: Lint the installer
        run: shellcheck install.sh tests/install_test.sh
      - name: Installer tests
        run: sh tests/install_test.sh

  installer-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # CI is set on GitHub runners, so the tests also change the (ephemeral) runner's user Path for real.
      - name: Installer tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_test.ps1
      - name: Installer tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/install_test.ps1

  installer-macos:
    name: Installer on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer tests
        run: sh tests/install_test.sh

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate dataset from result bundles
        working-directory: .
        run: ./benchmania publish
      - run: npm ci
      - run: npm run check
      - run: npm test
      # With a custom domain the site is served from the root, without one from /<repository>/: the stricter case.
      - name: Production build under a sub-path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - run: npm run verify
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
