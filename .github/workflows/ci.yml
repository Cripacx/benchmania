name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Engine, manifests and results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest==9.2.0
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Validate manifests and result bundles
        run: ./machbench validate
      - name: Build the website dataset
        run: ./machbench publish --out /tmp/site-data

  site:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Regenerate dataset from result bundles
        working-directory: .
        run: ./machbench publish
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Production build under a sub-path (as on GitHub Pages)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - run: npm run verify
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
