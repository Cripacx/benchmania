name: CodeQL

# Scans the engine, the workflows and the website. The benchmark implementations are left out: they are
# servers without authentication or rate limiting by design and only ever run inside a benchmark, so the
# findings there would be noise on every contributed implementation.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - domains/*/implementations
              - domains/*/sources
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
