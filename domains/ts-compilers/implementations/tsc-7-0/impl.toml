id = "tsc-7-0"
name = "tsc 7.0"
language = "Go"
runtime = "native (Go), started by a Node.js launcher"
variant = "stable"
category = "tool"
description = "The TypeScript compiler of the 7.0 line, ported to Go by the TypeScript team. The npm package's tsc command is a Node.js launcher that starts the native binary."
notes = [
  "TypeScript 7.0 is a different compiler revision from 7.1, which tsrs and tsc-rs track: compare those with tsc 7.1.",
]
maintainers = []

[versions]
typescript = "7.0.2"

[compiler]
package = "typescript"
typescript = "7.0"
command = ["tsc", "-p", "{tsconfig}", "--incremental", "false", "--composite", "false", "--pretty", "false"]
env = {}

[compiler.modes]
check = ["--noEmit"]
single = ["--noEmit", "--singleThreaded"]
emit = ["--outDir", "{out}", "--declaration"]

[build]
dockerfile = "../../images/tool/Dockerfile"
context = "../../images/tool"
