id = "tsc-7-0"
name = "tsc 7.0"
language = "Go"
runtime = "native (Go), started by a Node.js launcher that replaces itself with the binary (execve)"
variant = "stable"
category = "tool"
description = "The TypeScript compiler of the 7.0 line, ported to Go by the TypeScript team. The npm package's tsc command is a Node.js launcher that replaces itself with the native binary (process.execve, available in the Node.js of the image)."
notes = [
  "TypeScript 7.0 is an older compiler revision than the 7.1 builds that tsc 7.1 (beta), tsrs and tsc-rs implement: a comparison with the ports mixes revision and implementation language, and one with tsc 7.1 compares two releases of the same Go compiler.",
]
maintainers = []

[versions]
typescript = "7.0.2"

[compiler]
package = "typescript"
typescript = "7.0"
command = ["tsc", "-p", "{tsconfig}", "--incremental", "false", "--composite", "false", "--pretty", "false"]
env = {}
# Exit code when it reports errors (observed with 7.0.2); a run expecting diagnostics must exit with exactly this.
# tsc 7.0 follows TypeScript's convention: 1 = errors and no output written (--noEmit), 2 = errors, output written.
error_exit = { check = 1, single = 1, emit = 2 }

[compiler.modes]
check = ["--noEmit"]
single = ["--noEmit", "--singleThreaded"]
emit = ["--outDir", "{out}", "--declaration"]

[build]
dockerfile = "../../images/tool/Dockerfile"
context = "../../images/tool"
