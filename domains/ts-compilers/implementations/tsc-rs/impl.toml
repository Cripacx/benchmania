id = "tsc-rs"
name = "tsc-rs"
language = "Rust"
runtime = "native (Rust), started by a shell launcher"
variant = "experimental port"
category = "tool"
description = "An experimental port of the TypeScript 7.1 compiler to Rust (pingdotgg/ts-rust). Release 0.8.0 tracks the revision behind the 7.1.0-dev.20261008.1 nightly, which is older than 7.1.0-beta."
notes = [
  "Experimental: a port, not the TypeScript team's compiler.",
  "Tracks microsoft/TypeScript@fed0bf24149fb1ed36039212648bafdafc1ea10e (7.1.0-dev.20261008.1), an earlier 7.1 revision than tsc 7.1 (beta) and tsrs.",
  "Its --fast mode is not measured: it changes what the checker does and only the ports have it.",
]
maintainers = []

[versions]
tsc-rs = "0.8.0"

[compiler]
package = "tsc-rs"
typescript = "7.1"
upstream = "microsoft/TypeScript@fed0bf24149fb1ed36039212648bafdafc1ea10e"
repository = "https://github.com/pingdotgg/ts-rust"
command = ["tsc-rs", "-p", "{tsconfig}", "--incremental", "false", "--composite", "false", "--pretty", "false"]
env = {}

[compiler.modes]
check = ["--noEmit"]
single = ["--noEmit", "--singleThreaded"]
emit = ["--outDir", "{out}", "--declaration"]

[build]
dockerfile = "../../images/tool/Dockerfile"
context = "../../images/tool"
