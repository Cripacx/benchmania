id = "tsc-7-1"
name = "tsc 7.1 (beta)"
language = "Go"
runtime = "native (Go), started by a Node.js launcher that replaces itself with the binary (execve)"
variant = "pre-release"
category = "tool"
description = "The TypeScript compiler of the 7.1 line in Go, at the 7.1.0-beta pre-release. Included although it is a beta: it is the packaged Go build of the upstream revision that tsrs targets, so it is the like-for-like counterpart of tsrs."
notes = [
  "Pre-release: 7.1 has no stable release yet.",
  "The 7.1.0-beta package was published from microsoft/TypeScript@3e9236361fa97a9e6c685f4833ac457ae2d8c50a (gitHead of its package.json), the revision tsrs states it ports. tsc-rs tracks an earlier 7.1 development build (7.1.0-dev.20261008.1), so a comparison with tsc-rs mixes compiler revision and implementation language.",
  "tsc 7.0 and tsc 7.1 are both written in Go: a comparison between them is between two releases of the same Go compiler, not a change of implementation language.",
]
maintainers = []

[versions]
typescript = "7.1.0-beta"

[compiler]
package = "typescript"
typescript = "7.1"
upstream = "microsoft/TypeScript@3e9236361fa97a9e6c685f4833ac457ae2d8c50a"
command = ["tsc", "-p", "{tsconfig}", "--incremental", "false", "--composite", "false", "--pretty", "false"]
env = {}
error_exit = 2  # exit code when it reports errors, observed in every mode; a run expecting diagnostics must exit with exactly this

[compiler.modes]
check = ["--noEmit"]
single = ["--noEmit", "--singleThreaded"]
emit = ["--outDir", "{out}", "--declaration"]

[build]
dockerfile = "../../images/tool/Dockerfile"
context = "../../images/tool"
