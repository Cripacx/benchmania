id = "ts-compilers"
title = "TypeScript compilers"
summary = "The same TypeScript projects, type-checked and compiled by tsc 6, tsc 7 and two experimental Rust ports."
description = """
Five compilers check two open-source projects (TypeORM and Excalidraw) at pinned commits: tsc 6.0 (TypeScript \
on Node.js), tsc 7.0 and the 7.1 beta (Go), and the Rust ports tsrs and tsc-rs, which port TypeScript 7.1 builds. \
Each tool runs as a user would run it, through the command its npm package installs, in a fresh container \
without network access, on four cores with default settings and on one core with its single-threaded flag where it has one. A \
tool is only measured after it reported exactly the diagnostics expected for its TypeScript line on every \
project, and the expected diagnostics plus every one of seven or eight errors seeded into different files of a \
copy of each, in every mode. The tools implement different TypeScript revisions: tsc 7.1 (beta) and tsrs are two \
packaged implementations with the same declared upstream revision, so they are the like-for-like pair; tsc-rs \
tracks an earlier 7.1 build, and tsc 6.0 and 7.0 are older lines."""
# "experimental": published on the website, marked as such next to its numbers. A domain without a result
# bundle has to stay "example" (the website's dataset tests reject a published domain without a run).
status = "experimental"
harness = "harness:CompilerHarness"
methodology_version = "1"
ranking_note = "Mixed TypeScript revisions: tsc 7.1 (beta) and tsrs declare the same upstream revision, tsc-rs is pinned to an earlier 7.1 build, tsc 6.0 and 7.0 are older lines."

# Limits of every measurement container. The four-core scenarios are pinned to all service CPUs, the one-core
# scenarios to the first of them (a cpuset, no CPU quota on top). Node.js sizes its default heap from the
# memory limit, so the limit is part of the setup.
[service]
cpus = 4
memory = "8g"

[defaults]
node = "24.22.1"  # Node.js of every image: tsc 6 runs on it, tsc 7 and tsrs are started by a Node.js launcher
warmup = 1        # untimed runs first in every fresh container (page cache, Node.js compile cache)
repetitions = 5   # timed runs per scenario and pass; the median is reported, every value is kept

[quick]           # `--quick`: smoke test only, never published
warmup = 0
repetitions = 1

# Index over the four check scenarios (not emit). A tool gets it only with a valid measurement in all four;
# per scenario the fastest median wall time among those tools divided by this tool's, geometric mean of those
# ratios, times 100.
[[derived]]
id = "check_index"
kind = "geomean_relative"
metric = "wall_ms"
scenarios = ["typeorm-check", "typeorm-check-1cpu", "excalidraw-check", "excalidraw-check-1cpu"]

[[derived]]
id = "peak_rss_max_mib"
kind = "max"
metric = "peak_rss_mib"
scenarios = "*"

[[headline]]
metric = "check_index"
label = "Check speed index"
hint = "For each of four type checks (TypeORM and Excalidraw, on four cores and on one), the fastest median wall time among the tools that have an index divided by this tool's; the index is the geometric mean of those four ratios times 100. 100 means fastest in all four, 50 means twice the fastest time on geometric average. It is relative to the tools of this run, so another set of tools can change it, and it spans different compiler revisions (TypeScript 6.0, 7.0 and 7.1): the like-for-like pair is tsc 7.1 (beta) and tsrs, two packaged implementations with the same declared upstream revision (tsc-rs tracks an earlier 7.1 build)."

[[headline]]
scenario = "typeorm-check"
metric = "wall_ms"
label = "TypeORM check"
hint = "Median wall time of a type check of the TypeORM project (not incremental, no output), default settings, four cores."

[[headline]]
scenario = "excalidraw-check"
metric = "wall_ms"
label = "Excalidraw check"
hint = "Median wall time of a type check of the Excalidraw project (not incremental, no output), default settings, four cores."

[[headline]]
metric = "peak_rss_max_mib"
label = "Memory"
hint = "Per scenario, the median over the timed runs of the largest resident set of any single process of the command (ru_maxrss from wait4, over the processes it waited for; not a sum). The headline is the highest such value in any scenario."

# Comparisons the website suggests, first one first. Say what is compared and why it is fair or not, never who wins.
[[compare]]
title = "Same declared revision: Go and Rust"
ids = ["tsc-7-1", "tsrs"]
note = "tsc 7.1 (beta) and tsrs are two packaged implementations with the same declared upstream revision (the one of 7.1.0-beta), one written in Go and one in Rust: the like-for-like pair of this domain. Launcher, runtime and threading differ as well, and the correctness gate does not show that both do the same amount of work, so a difference is not the language alone."

[[compare]]
title = "The tsc lines: 6.0, 7.0 and 7.1 (beta)"
ids = ["tsc-6-0", "tsc-7-0", "tsc-7-1"]
note = "The TypeScript team's compiler across three lines: 6.0 is written in TypeScript and runs on Node.js, 7.0 and the 7.1 beta are written in Go. 6.0 against 7.0 mixes compiler revision and implementation language; 7.0 against 7.1 compares two releases of the same Go compiler."

[[compare]]
title = "The Rust ports and tsc 7.1 (beta)"
ids = ["tsc-7-1", "tsrs", "tsc-rs"]
note = "All three target TypeScript 7.1, but tsc-rs is pinned to an earlier 7.1 development build than the other two, so a comparison with tsc-rs mixes revision and implementation."

# The domain's part of the methodology page: engine-wide rules are described by the website itself.
[methodology]
document = "domains/ts-compilers/README.md"
# An empty name marks a role this domain does not use: there is no supporting service, so those cores are
# assigned to no role. There is no load generator either, but the engine pins the benchmark runner to that role's cores.
roles = { service = "Compiler under test", environment = "", loadgen = "Benchmark runner" }
checks = [
  { check = "Correctness gate before measuring: in every scenario and mode a tool must report exactly the diagnostics expected for its TypeScript line, and on a copy of each project with seven or eight seeded errors exactly those as well, each at the expected file, line, column and code, with exactly the exit code the tool declares", effect = "Tool is excluded from the run" },
  { check = "A run (warm-up or timed) reports other diagnostics, exits with another code than expected, leaves a process behind, or (emit) writes a different number of .js and .d.ts files", effect = "Not a measurement: the scenario stays unmeasured in that pass, with the reason in its quality flags" },
]
limitations = [
  "The tools implement different TypeScript revisions (6.0, 7.0 and two builds of 7.1). Only tsc 7.1 (beta) and tsrs declare the same upstream revision; the check speed index spans all of them.",
  "The correctness gate shows agreement on the diagnostics of two projects and on fifteen seeded errors. It does not show that every tool checks every file or does the same amount of work, so a difference in time is not attributable to the implementation language alone.",
  "Three of the five tools are not stable releases: tsc 7.1 is a beta, tsrs and tsc-rs are experimental ports.",
  "Every tool runs through the command its npm package installs. For tsc 7, tsrs and tsc-rs that is a launcher that replaces itself with the compiler; its start-up is part of the wall time and of the peak memory.",
  "Two projects at pinned commits, whole-project checks only: incremental checks, watch mode and editor (language server) use are not measured.",
  "Emitted output is verified by the number of files, not by content, and not compared between tools.",
  "Peak memory is that of the largest single process of a command, not a sum over its processes.",
  "The Node.js base image is referenced by tag and the compilers' transitive npm packages are not locked; every result records the image that was measured.",
  "A measurement that carries a quality flag still counts in the medians; the flag is shown next to it.",
]
versions = { "1" = "First methodology of this domain: correctness gate with fifteen seeded errors in every mode and exact exit codes, a fresh container per scenario and pass, one untimed warm-up and five timed runs, verification of every run (also before a steal-time retry), no process left behind." }
