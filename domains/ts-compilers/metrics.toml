# Metric registry of the ts-compilers domain. Every value is the median of the timed runs of one pass;
# the raw values of every run are in the quality data of the result bundle.

[wall_ms]
label = "Wall time"
unit = "ms"
better = "lower"
group = "time"
decimals = 0
visibility = "primary"
description = "Time from spawning the tool's command until it exited, measured inside the container with a monotonic clock (docker exec is not included). Covers the whole command: a launcher and the compiler it starts."

[cpu_ms]
label = "CPU time"
unit = "ms"
better = "lower"
group = "cpu"
decimals = 0
visibility = "primary"
description = "User plus system CPU time of the command and every process it started and waited for (from wait4), all threads included."

[peak_rss_mib]
label = "Peak memory"
unit = "MiB"
better = "lower"
group = "memory"
decimals = 0
visibility = "primary"
description = "Median over the timed runs of the largest peak resident set size of any single process of the command (ru_maxrss from wait4, which covers the command and the descendants it waited for). It is a maximum over processes, not a sum: a launcher's memory is not added to the compiler's. It counts resident pages of that one process, including its mapped binary and libraries; not the page cache of files it only read, and nothing of processes the command did not wait for."

[parallelism]
label = "Parallelism"
unit = "cores"
better = "neutral"
group = "cpu"
decimals = 2
visibility = "diagnostic"
description = "CPU time divided by wall time: how many cores the tool kept busy on average. Neither higher nor lower is better on its own."

[peak_rss_max_mib]
label = "Peak memory, any scenario"
unit = "MiB"
better = "lower"
group = "summary"
decimals = 0
visibility = "primary"
description = "The highest peak memory (the per-scenario median of the largest single-process resident set) in any scenario."

[check_index]
label = "Check speed index"
unit = "index"
better = "higher"
group = "summary"
decimals = 1
visibility = "primary"
description = "Per check scenario, the fastest tool's median wall time divided by this tool's; the geometric mean of those ratios over the four check scenarios, times 100 (100 = fastest in all four, 50 = twice the fastest time on geometric average). Relative to the tools of the run, from the per-scenario medians. Spans different compiler revisions: the like-for-like pair is tsc 7.1 (beta) and tsrs, two packaged implementations of the same upstream revision."
