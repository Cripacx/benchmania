id = "java-spring-aotcache"
name = "Java · Spring Boot"
language = "Java"
runtime = "JVM (HotSpot)"
framework = "Spring Boot (Spring MVC)"
variant = "JVM + AOT cache"
category = "fullstack"
description = "The same Spring Boot service with a Project Leyden AOT cache created by a training run at build time (JEP 514/515)."
maintainers = []
notes = ["The training run stops after context refresh, so the cache holds start-up classes and profiles.", "Heap limited to 50 % of the container memory limit (-XX:MaxRAMPercentage=50, 512 MiB of 1 GiB) instead of the JDK default of 25 %, as production images usually do; default GC. Reported memory is bounded by this heap setting.", "JdbcClient without a transaction checks a HikariCP connection out per statement, so /queries and /updates take one checkout per statement rather than one per request (idiomatic without a transaction)."]
source = "../../sources/spring"

[versions]
language = "Java 25 (bytecode), Java 27 runtime"
runtime = "27.0.1"
framework = "Spring Boot 4.1.2"

[build]
dockerfile = "../../sources/spring/Dockerfile.jvm"
context = "../../sources/spring"
args = { AOTCACHE = "1" }
