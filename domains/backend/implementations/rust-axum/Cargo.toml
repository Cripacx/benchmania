[package]
name = "bench"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio-postgres = "=0.7.18"
deadpool-postgres = "=0.14.2"
fastrand = "=2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
