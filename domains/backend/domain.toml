id = "backend"
title = "Backend services"
summary = "HTTP services backed by PostgreSQL, each running in the same small, resource-limited container."
description = """
Every implementation serves the same API (JSON, single and multiple queries, updates, a list endpoint and \
a JSON POST) against the same PostgreSQL 18 database. The service gets 2 CPU cores and 1 GiB of memory, like \
a small production pod. The database container and the load generator's processes are pinned to the CPUs of their \
own roles, which the layout keeps apart from the service's when the machine has enough cores. Results cover \
throughput, latency at fixed load, CPU per request, memory, cold start and warm-up."""
status = "stable"
harness = "harness:BackendHarness"
methodology_version = "1"

# Limits for every implementation container.
[service]
cpus = 2
memory = "1g"
port = 8080

[defaults]
warmup = "5s"          # per scenario, right before the measured run
duration = "15s"       # measured
connections = 128
global_warmup = "4s"   # per endpoint, once per implementation and pass, before the first scenario
ready_timeout = "120s"
startup_runs = 5

[quick]                # `--quick`: smoke tests only, results are marked and never published
warmup = "1s"
duration = "2s"
global_warmup = "1s"
startup_runs = 2

# Metrics computed from the summary of each run (see core/benchcore/publish.py).
# An index needs a usable result in every listed scenario; a scenario with more than 1 % failed requests
# does not count as one, so an implementation that answers errors quickly gets no index instead of a good one.
[[derived]]
id = "throughput_index"
kind = "geomean_relative"
metric = "rps"
scenarios = ["json", "db", "queries", "updates", "list", "orders"]
valid_when = { metric = "error_rate", max = 0.01 }

[[derived]]
id = "efficiency_index"
kind = "geomean_relative"
metric = "cpu_us_per_req"
scenarios = ["json", "db", "queries", "updates", "list", "orders"]
valid_when = { metric = "error_rate", max = 0.01 }

[[derived]]
id = "peak_memory_mib"
kind = "max"
metric = "mem_pss_peak_mib"
scenarios = "*"

# What the website shows first. Everything else is one click away.
[[headline]]
metric = "throughput_index"
label = "Throughput index"
hint = "Geometric mean over six workloads, each relative to the fastest in that workload. 100 means fastest in all six."

[[headline]]
scenario = "rate"
metric = "latency_p99_ms"
label = "Latency under load"
hint = "p99 at a fixed 5,000 requests per second."

[[headline]]
metric = "peak_memory_mib"
label = "Memory"
hint = "Highest proportional set size (PSS) seen in any scenario."

[[headline]]
scenario = "startup"
metric = "startup_ms"
label = "Cold start"
hint = "Container start until the first successful response."

# The domain's part of the methodology page: engine-wide rules are described by the website itself.
[methodology]
document = "docs/methodology.md"
roles = { service = "Service under test", environment = "PostgreSQL", loadgen = "Load generator (wrk, oha) and runner" }
checks = [
  { check = "Functional checks before measuring: values, shapes, content types, persisted updates, totals, rejected invalid input", effect = "Implementation is excluded from the run" },
  { check = "Database statements per request (pg_stat_statements) deviate more than 3 % from the scenario specification", effect = "Result flagged" },
  { check = "Errors during a measurement (socket errors, timeouts, non-2xx/3xx)", effect = "Result flagged with count and rate; failed requests never count as throughput" },
  { check = "More than 1 % failed requests or a throughput of zero in one of the workloads behind an index", effect = "No index for that implementation; its scenario results stay visible" },
  { check = "Load generator CPU above 90 %", effect = "Throughput flagged as a lower bound" },
  { check = "Database CPU above 90 % of its cores", effect = "Flagged: the database limits the throughput, not only the service" },
  { check = "Fixed-rate scenario reaches less than 97 % of the target rate", effect = "Result flagged: latency then describes queueing, not the service" },
]
limitations = [
  "Start-up time includes docker start. The overhead is identical for every implementation but means the numbers are not process start times.",
  "CPU package energy covers the whole package, including the database and the load generator; compare it within one run only.",
  "Memory (PSS) is sampled once per second, so very short spikes can be missed. The cgroup's anonymous-memory peak complements it.",
  "The load generator and the database share the machine. Their CPU use is measured and flagged when it could limit throughput.",
  "Workloads are synthetic, shaped after common production endpoints; pool sizes and worker counts are documented on each implementation page.",
  "Categories matter: a bare server without a framework does less work than a full-stack framework. Compare like with like.",
]
versions = { "0" = "Pre-release shell suite: throughput, p50/p99 latency, errors, start-up and memory only; floating image tags; peak memory recorded once per run; 3 s warm-up and 12 s measurement per scenario.", "1" = "Engine release: pinned versions and image digests, CPU per request, database work verification, PSS per scenario, steal-time retries, energy, CPU clock, persisted-update and content-type checks, deterministic database content, 5 s warm-up and 15 s measurement." }
