# Project identity. Every user-facing name is read from here (CLI, container names, website).
# To rename the project, change these values and run: python tools/rename_project.py <NewName>
[project]
name = "Benchmania"
slug = "benchmania"
tagline = "Community-driven, reproducible performance benchmarks"
description = "Benchmania measures how software performs under realistic, controlled conditions. Anyone can contribute implementations, benchmark domains and measurements from their own hardware; every number is published with the hardware, versions and raw data behind it."
repository = "https://github.com/Cripacx/benchmania"
site_url = "https://benchmania.cleson.tech"
license = "MIT"
data_license = "CC-BY-4.0"

# Defaults for every run. Domains and the command line can override them.
[run]
passes = 5
max_steal_percent = 2.0
max_retries = 2
results_dir = "results"
